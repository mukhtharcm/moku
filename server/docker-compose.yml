services:
  moku-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mukhtharcm/moku-server:latest
    container_name: moku-server
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/app/pb_data
    environment:
      # PocketBase creates the first superuser from these on first boot
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL:-admin@example.com}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pb_data:
