name: Moku
options:
  bundleIdPrefix: com.mukhtharcm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: Moku
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.books"
    INFOPLIST_KEY_CFBundleDisplayName: Moku
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  Moku:
    type: application
    platform: macOS
    sources:
      - path: Moku
        excludes:
          - "**/.DS_Store"
          - "**/.gitkeep"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2025 mukhtharcm"
        CODE_SIGN_ENTITLEMENTS: Moku/App/Moku.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mukhtharcm.moku
    dependencies:
      - package: ZIPFoundation
    entitlements:
      path: Moku/App/Moku.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.files.bookmarks.app-scope: true
