name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (optional)'
        required: false
      submit_public_testflight:
        description: 'Submit the build to the public TestFlight group'
        required: false
        default: 'true'
        type: boolean
      what_to_test:
        description: 'What to Test notes override (optional)'
        required: false

jobs:
  build-and-deploy:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: '3.41.7'
      ASC_APP_ID: '6762592985'
      TESTFLIGHT_PUBLIC_GROUP_ID: 'eba5aac1-e257-46cc-9939-07e64c181b55'
      TESTFLIGHT_PUBLIC_GROUP_NAME: 'Friends :)'
      TESTFLIGHT_LOCALE: 'en-US'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Set up Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        working-directory: app/ios
        run: pod install --repo-update

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/moku_appstore.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "Installed profile: $PROFILE_UUID"

      - name: Configure manual signing for CI
        working-directory: app/ios
        run: |
          python3 << 'PYEOF'
          import re

          with open('Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()

          # Change code sign identity to Apple Distribution
          content = content.replace(
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer"',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"'
          )

          # After each DEVELOPMENT_TEAM line, add manual signing settings
          content = content.replace(
              'DEVELOPMENT_TEAM = SMKA33JW93;',
              'DEVELOPMENT_TEAM = SMKA33JW93;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Moku AppStore Distribution";'
          )

          with open('Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)

          print("Configured manual signing for CI")
          PYEOF

      - name: Determine version
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          INPUT_WHAT_TO_TEST: ${{ github.event.inputs.what_to_test }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          fi

          if [[ -n "$INPUT_BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER=${{ github.run_number }}
          fi

          WHAT_TO_TEST="$INPUT_WHAT_TO_TEST"
          if [[ -z "$WHAT_TO_TEST" ]]; then
            WHAT_TO_TEST="Please smoke test book import and reading flows for v${VERSION} (${BUILD_NUMBER}): EPUB/PDF/CBZ import, reader resize and pagination, PDF controls, sync login, library shelves, and settings."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "WHAT_TO_TEST<<EOF"
            echo "$WHAT_TO_TEST"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Building v${VERSION} (${BUILD_NUMBER})"

      - name: Build IPA
        working-directory: app
        run: |
          flutter build ipa \
            --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Install asc
        run: brew install asc

      - name: Authenticate asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          ASC_KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

          asc auth login \
            --name ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key "$ASC_KEY_PATH" \
            --network

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          shopt -s nullglob
          ipa_files=(app/build/ios/ipa/*.ipa)
          if [[ ${#ipa_files[@]} -eq 0 ]]; then
            echo "No IPA found in app/build/ios/ipa" >&2
            exit 1
          fi
          IPA_PATH="${ipa_files[0]}"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Finalize TestFlight build
        id: finalize
        run: |
          asc builds wait \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --platform IOS \
            --timeout 30m \
            --output table

          BUILD_JSON=$(asc builds info \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --platform IOS \
            --output json)
          BUILD_ID=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$BUILD_JSON")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          asc builds update \
            --build-id "$BUILD_ID" \
            --uses-non-exempt-encryption=false \
            --output table

          asc builds test-notes update \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --platform IOS \
            --locale "$TESTFLIGHT_LOCALE" \
            --whats-new "$WHAT_TO_TEST" \
            --output table || \
          asc builds test-notes create \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --platform IOS \
            --locale "$TESTFLIGHT_LOCALE" \
            --whats-new "$WHAT_TO_TEST" \
            --output table

          asc validate testflight \
            --app "$ASC_APP_ID" \
            --build "$BUILD_ID" \
            --output table

      - name: Submit public TestFlight beta
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.submit_public_testflight != 'false' }}
        run: |
          asc builds add-groups \
            --build-id "${{ steps.finalize.outputs.build_id }}" \
            --group "$TESTFLIGHT_PUBLIC_GROUP_ID" \
            --submit \
            --confirm \
            --output table

      - name: Write TestFlight summary
        if: always()
        run: |
          {
            echo "## TestFlight deployment"
            echo
            echo "- App ID: \`$ASC_APP_ID\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Build: \`${{ steps.version.outputs.build_number }}\`"
            echo "- Public group: \`$TESTFLIGHT_PUBLIC_GROUP_NAME\`"
            echo
            echo "### Build status"
            echo
            asc builds info \
              --app "$ASC_APP_ID" \
              --version "${{ steps.version.outputs.version }}" \
              --build-number "${{ steps.version.outputs.build_number }}" \
              --platform IOS \
              --output markdown || true
            echo
            echo "### Beta detail"
            echo
            asc builds build-beta-detail \
              view \
              --build-id "${{ steps.finalize.outputs.build_id }}" \
              --output markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moku-${{ steps.version.outputs.version }}.ipa
          path: app/build/ios/ipa/*.ipa

      - name: Clean up
        if: always()
        run: |
          asc auth logout --name ci || true
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/moku_appstore.mobileprovision"
          rm -rf ~/.private_keys
