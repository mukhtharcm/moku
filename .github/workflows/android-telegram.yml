name: Build Android Canary

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-telegram.yml'
  workflow_dispatch:

concurrency:
  group: android-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: '3.41.7'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate release and delivery secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_STORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore_path="$RUNNER_TEMP/moku-upload-keystore.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Determine version metadata
        id: version
        run: |
          version=$(grep '^version:' app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          build_number=${{ github.run_number }}
          short_sha="${GITHUB_SHA::7}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Stage APK artifacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-*-release.apk dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moku-android-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-${{ steps.version.outputs.short_sha }}-split-apks
          path: dist/*.apk
          retention-days: 14

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/send_telegram_media_group.py

      - name: Clean up signing material
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"
