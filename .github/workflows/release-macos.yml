name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.1.2). Defaults to pubspec.yaml.
        required: false
        type: string
      build_number:
        description: Build number override. Defaults to the GitHub run number.
        required: false
        type: string
      notarize:
        description: Submit and staple notarization tickets.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_NAME: Moku
      BUNDLE_IDENTIFIER: com.moku.moku
      FLUTTER_VERSION: "3.41.7"
      HAS_SIGNING_SECRETS: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.SIGNING_IDENTITY != '' }}
      HAS_ASC_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_NOTARIZE: ${{ inputs.notarize }}
        run: |
          version="$INPUT_VERSION"

          if [[ -z "$version" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            version=$(awk '/^version:/ {print $2; exit}' app/pubspec.yaml)
            version="${version%%+*}"
          fi

          build_number="$INPUT_BUILD_NUMBER"
          if [[ -z "$build_number" ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          notarize="true"
          if [[ "$INPUT_NOTARIZE" == "false" ]]; then
            notarize="false"
          fi

          release_tag="v$version"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "notarize=$notarize"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        env:
          NOTARIZE: ${{ steps.meta.outputs.notarize }}
        run: |
          if [[ "$HAS_SIGNING_SECRETS" != "true" ]]; then
            echo "::error::Missing Developer ID signing secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD, KEYCHAIN_PASSWORD, SIGNING_IDENTITY"
            exit 1
          fi

          if [[ "$NOTARIZE" == "true" && "$HAS_ASC_SECRETS" != "true" ]]; then
            echo "::error::Missing App Store Connect API key secrets for notarization: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/moku-developer-id.p12"
          keychain_path="$RUNNER_TEMP/moku-macos-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -d user -s "$keychain_path"

          security find-identity -v -p codesigning | grep -F "$SIGNING_IDENTITY"

      - name: Install asc
        if: steps.meta.outputs.notarize == 'true'
        run: brew install asc

      - name: Authenticate asc
        if: steps.meta.outputs.notarize == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          asc_key_path="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$asc_key_path"
          chmod 600 "$asc_key_path"

          asc auth login \
            --name ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key "$asc_key_path" \
            --network

          echo "NOTARYTOOL_KEY_PATH=$asc_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, package, and notarize
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APP_NAME: ${{ env.APP_NAME }}
          BUNDLE_IDENTIFIER: ${{ env.BUNDLE_IDENTIFIER }}
          NOTARIZE: ${{ steps.meta.outputs.notarize }}
          NOTARIZE_DMG: "true"
          NOTARY_ATTEMPTS: "3"
          ASC_NOTARY_ATTEMPTS: "1"
          ASC_UPLOAD_TIMEOUT: 5m
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NOTARYTOOL_KEY_PATH: ${{ env.NOTARYTOOL_KEY_PATH }}
        run: .github/scripts/package_macos_flutter.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moku-macos-${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build_number }}
          path: |
            dist/macos/${{ steps.meta.outputs.version }}/*.zip
            dist/macos/${{ steps.meta.outputs.version }}/*.dmg
            dist/macos/${{ steps.meta.outputs.version }}/*.log
            dist/macos/${{ steps.meta.outputs.version }}/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## Moku $VERSION"
            echo
            echo "Flutter macOS release of Moku."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          zip_name="Moku-${VERSION}.zip"
          dmg_name="Moku-${VERSION}.dmg"
          release_args=()

          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Moku $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --title "Moku $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${release_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/macos/$VERSION/$zip_name" \
            "dist/macos/$VERSION/$dmg_name" \
            --clobber

      - name: Write release summary
        if: always()
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          NOTARIZE: ${{ steps.meta.outputs.notarize }}
        run: |
          {
            echo "## Moku macOS release"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- Bundle identifier: \`$BUNDLE_IDENTIFIER\`"
            echo "- Notarization requested: \`$NOTARIZE\`"
            echo
            echo "### Artifacts"
            echo
            find "dist/macos/$VERSION" -maxdepth 1 -type f -print 2>/dev/null | sort | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          asc auth logout --name ci || true
          security delete-keychain "$RUNNER_TEMP/moku-macos-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/moku-developer-id.p12"
          rm -rf ~/.private_keys
